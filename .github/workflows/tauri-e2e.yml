name: Tauri desktop smoke E2E

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  tauri-e2e-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            webkit2gtk-driver \
            xvfb

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            v2/package-lock.json
            e2e-tests/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix v2

      - name: Install e2e deps
        run: npm ci --prefix e2e-tests

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Frontend tests
        run: npm --prefix v2 test

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install tauri-cli (cargo tauri build)
        run: cargo install tauri-cli --locked

      - name: Desktop smoke E2E
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: xvfb-run -a npm --prefix e2e-tests test
